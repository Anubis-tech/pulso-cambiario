name: Actualizar USDT/BOB (paralelo)

on:
  schedule:
    # Cada 15 minutos, casi en tiempo real. Workflow liviano: solo Binance P2P.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}  # permite lanzarlo manualmente desde la pestaña Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Consultar Binance P2P (USDT/BOB)
        run: python scripts/update_data.py --only usdt

      - name: Publicar cambios si hubo datos nuevos
        run: |
          git config user.name "pulso-cambiario-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "Sin cambios - no se hace commit."
          else
            git commit -m "USDT/BOB: actualización automática ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            for i in 1 2 3; do
              git pull --rebase origin HEAD && git push && break
              echo "Push falló (probablemente chocó con el otro workflow), reintentando ($i)..."
              sleep 5
            done
          fi
