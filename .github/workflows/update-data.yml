name: Actualizar datos de Pulso Cambiario

on:
  schedule:
    # Cada 3 horas. GitHub Actions usa UTC; Bolivia es UTC-4 todo el año.
    - cron: "0 */3 * * *"
  workflow_dispatch: {}  # permite lanzarlo manualmente desde la pestaña Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Actualizar datos numéricos (TCO, bancos, reservas, balanza, ITCR)
        run: python scripts/update_data.py --only tco,banks,reservas,balanza,itcr

      - name: Actualizar noticias (RSS de El Deber)
        run: python scripts/update_news.py

      - name: Publicar cambios si hubo datos nuevos
        run: |
          git config user.name "pulso-cambiario-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json noticias.json
          if git diff --cached --quiet; then
            echo "Sin cambios - no se hace commit."
          else
            git commit -m "Actualización automática de datos ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            for i in 1 2 3; do
              git pull --rebase origin HEAD && git push && break
              echo "Push falló (probablemente chocó con el workflow de USDT), reintentando ($i)..."
              sleep 5
            done
          fi
